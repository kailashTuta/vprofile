name: CI

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            
            - name: Set Up Java
              uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: '25'
                cache: maven
              
            - name: Build with Maven
              run: mvn -B clean package

            - name: Upload built artifact
              uses: actions/upload-artifact@v4
              with:
                name: packaged-artifact
                path: target/vprofile-v2.war

    dependency-check:
        runs-on: ubuntu-latest
        needs: [build]
        steps:
          - uses: actions/download-artifact@v8
            with:
              name: packaged-artifact

          - name: Display structure of downloaded files
            run: ls -R

          - name: Run Dependency-Check Action
            uses: dependency-check/Dependency-Check_Action@main
            continue-on-error: true
            with:
              project: 'my-maven-app'
              path: '.'
              format: 'HTML'
              args: >
                --failOnCVSS 7
                --nvdApiKey ${{ secrets.NVD_API_KEY }}

          - name: Upload Dependency-Check report
            if: always()
            uses: actions/upload-artifact@v4
            with:
              name: dependency-check-report
              path: reports
              if-no-files-found: warn
              retention-days: 7
    
    docker-scan:
      runs-on: ubuntu-latest
      needs: [dependency-check]
      strategy:
        fail-fast: false
        matrix:
          folders: [app, db]
      steps:
        - name: checkout code
          uses: actions/checkout@v7
          
        - name: Dockerfile Lint
          uses: hadolint/hadolint-action@v3.1.0
          with:
            dockerfile: ${{ matrix.folders }}/Dockerfile

        - name: Setup Docker [Login]
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Docker Build 
          run: docker build -t ${{ secrets.DOCKER_USERNAME }}/vprofile-${{ matrix.folders }}:latest .
          working-directory: ${{ matrix.folders }}

        - name: Run Trivy Vulnerability Scan
          uses: aquasecurity/trivy-action@v0.36.0
          continue-on-error: true
          with:
            image-ref: ${{ secrets.DOCKER_USERNAME }}/vprofile-${{ matrix.folders }}:latest
            format: 'table'
            exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'


              
